<!DOCTYPE html>
<html>

    <body>
        <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5BW3ZWX3"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            
            const params = new URLSearchParams(window.location.search);
            const stop_id = params.get("id");

            if (stop_id) {
                window.dataLayer.push({
                    'event': 'stop_redirect',
                    'stop_id': stop_id
                });
            }
            
            // const url = "https://bustracker.gocarta.org/predictions/bystop/bustime:" + stop_id;
            const url = "https://bustracker.gocarta.org/map?stpid=bustime:" + stop_id;

            setTimeout(function() {
                window.location = url;
            }, 200);
        </script>
    </body>
</html>
